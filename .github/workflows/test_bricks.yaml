name: Test Mason Bricks

on:
  push:
    branches: [master, main]
    paths:
      - 'bricks/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'bricks/**'
  workflow_dispatch:

jobs:
  test-flutter-mvvm:
    name: Test flutter_mvvm Brick
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Install Mason CLI
        run: dart pub global activate mason_cli
      
      - name: Initialize Mason
        run: mason init

      - name: Resolve Hook Dependencies
        working-directory: ./bricks/flutter_mvvm/hooks
        run: dart pub get
      
      - name: Add flutter_mvvm brick globally
        run: mason add -g flutter_mvvm --path ./bricks/flutter_mvvm
      
      - name: Generate test app from brick
        run: |
          mkdir -p /tmp/ci_test/ci_test_app
          cat > /tmp/brick_config.json << 'EOF'
          {
            "project_name": "ci_test_app",
            "org_name": "com.example",
            "description": "CI Test App",
            "use_firebase": false,
            "use_analytics": false,
            "use_cached_network_image": true
          }
          EOF
          mason make flutter_mvvm \
            -c /tmp/brick_config.json \
            --on-conflict overwrite \
            --output-dir /tmp/ci_test/ci_test_app
      
      - name: Install dependencies
        working-directory: /tmp/ci_test/ci_test_app
        run: flutter pub get
      
      - name: Generate code (build_runner)
        working-directory: /tmp/ci_test/ci_test_app
        run: dart run build_runner build --delete-conflicting-outputs
      
      - name: Analyze generated code
        working-directory: /tmp/ci_test/ci_test_app
        run: flutter analyze --no-fatal-infos
      
      - name: Run tests (if any exist)
        working-directory: /tmp/ci_test/ci_test_app
        run: flutter test --no-pub || echo "No tests to run"

  validate-all-bricks:
    name: Validate All Bricks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Dart/Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Install Mason CLI
        run: dart pub global activate mason_cli
      
      - name: Validate all bricks
        run: |
          for dir in bricks/*/; do
            brick_name=$(basename "$dir")
            echo "Validating brick: $brick_name"
            
            # Check for brick.yaml
            if [ ! -f "${dir}brick.yaml" ]; then
              echo "Error: $brick_name is missing brick.yaml"
              exit 1
            fi
            
            # Check for __brick__ directory
            if [ ! -d "${dir}__brick__" ]; then
              echo "Error: $brick_name is missing __brick__ directory"
              exit 1
            fi
            
            # Additional checks can be added here
            echo "Successfully validated $brick_name"
          done
