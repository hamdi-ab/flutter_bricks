name: media_picker_service
description: Scaffolds a reusable media/file picking service with permission handling.
version: 1.0.0
environment:
  mason: ">=0.1.0-dev <1.0.0"
vars:
  use_file_picker:
    type: boolean
    description: Include file selection support?
    default: true
    prompt: Do you need generic file picking support?
