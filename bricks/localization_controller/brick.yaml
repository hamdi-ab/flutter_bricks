name: localization_controller
description: Scaffolds a robust localization system with locale persistence, Riverpod state management, and ARB-based translations.
version: 1.0.0
environment:
  mason: ">=0.1.0-dev <1.0.0"
vars:
  default_locale:
    type: string
    description: Default locale code (e.g., en, ar, es)
    default: en
    prompt: What should be the default locale?
