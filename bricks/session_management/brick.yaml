name: session_management
description: Enterprise-grade session management with token pairs, expiry tracking, auto-refresh, and session state streaming.
version: 1.0.0
environment:
  mason: ">=0.1.0-dev <1.0.0"
vars:
  enable_auto_refresh:
    type: boolean
    description: Enable automatic token refresh before expiry
    default: true
    prompt: Enable automatic token refresh?
  refresh_buffer_minutes:
    type: number
    description: Minutes before token expiry to trigger refresh (only used if auto-refresh is enabled)
    default: 1
    prompt: Minutes before expiry to refresh token?
